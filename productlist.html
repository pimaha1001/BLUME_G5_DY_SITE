<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>BLUME – Produkter</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Fælles sidehoved og navigation. -->
    <header class="header">

        <a class="logo_wrap" href="index.html" aria-label="BLUME – forside">
            <img src="images/blume-logo.png" class="logo" alt="BLUME">

        </a>
        <button class="burger" aria-label="Open menu">
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
        </button>


        <nav class="navbar">
            <ul>
                <li><a href="index.html" class="active">Frontpage</a></li>
                <li><a href="productlist.html">Products</a></li>

            </ul>
        </nav>

        <nav class="header-actions" aria-label="Quick links">
            <a href="search.html" aria-label="Search" title="Search">
                <img src="images/search.svg" alt="" aria-hidden="true" width="30" height="30">
            </a>
            <a href="favorites.html" aria-label="Favorites" title="Favorites">
                <img src="images/heart.svg" alt="" aria-hidden="true" width="30" height="30">
            </a>
            <a href="#" id="login-open" aria-label="Åbn login">
                <img src="images/profil.svg" alt="Profil" aria-hidden="true" width="30" height="30">
            </a>
            <a href="basket.html" aria-label="Basket" title="Basket">
                <img src="images/basket.svg" alt="" aria-hidden="true" width="40" height="40">
            </a>

        </nav>

    </header>

    <main class="productlist-page">

        <!-- Overskrift ændres af productlist.js efter valgt kategori. -->
        <section class="productlist-header">
            <h1 id="category-title">Products</h1>

            <p>
                Discover your new favoritess.
            </p>
        </section>
        <div class="btn_container">
            <!-- Knapperne vælger kategori; sorteringsknappen sorterer den viste liste. -->
            <button class="btn" data-category="beauty">Beauty-products</button>
            <button class="btn" data-category="fragrances">Fragrances</button>
            <!-- Natural-demoen er midlertidigt deaktiveret.
            <button class="btn" data-category="natural">Natural</button>
            -->
        </div>
        <button type="button" class="btn sort_button">
            Sort by price: low to high
        </button>
        <p id="basket-action-status" role="status" aria-live="polite"></p>

        <!-- Produktkort indsættes her af productlist.js. -->
        <section class="product_list_container" aria-live="polite">
        </section>
        <!-- Fælles sidefod. -->
        <footer class="footer">
            <!-- API-hjælpere skal indlæses før produktlistens kode. -->
            <script src="script.js"></script>

    </main>


    <footer class="footer">
        <div class="footer-grid">

            <div>
                <h3>Finding your way</h3>
                <ul>
                    <li><a href="index.html">Frontpage</a></li>
                    <li><a href="productlist.html">Productlist</a></li>

                </ul>
            </div>

            <div class="footer-social">
                <img src="images/blume-logo.png" class="logo" alt="BLUME">

            </div>

            <div class="footer-information">
                <h3>Information</h3>
                <ul>
                    <li><a href="index.html">about BLUME</a></li>
                    <li><a href="mailto:info@blume.dk">Contact</a></li>
                </ul>
            </div>

        </div>

        <div class="footer-bottom">
            <div class="social-icons">
                <a href="#" target="_blank">
                    <img src="images/icons8-facebook-24.png" alt="Facebook">
                </a>

                <a href="#" target="_blank">
                    <img src="images/icons8-instagram-24.png" alt="Instagram">
                </a>
                <a href="#" target="_blank">
                    <img src="images/icons8-tiktok-24.png" alt="Tiktok">
                </a>
            </div>

            <p>© BLUME 2026. All Rights Reserved.</p>
        </div>
    </footer>
    <div class="login-overlay" id="login-overlay" hidden>
        <section class="login-popup" role="dialog" aria-modal="true" aria-labelledby="login-title">
            <button class="login-close" id="login-close" type="button" aria-label="Luk">
                &times;
            </button>

            <h2 id="login-title">LOG IN</h2>

            <form id="login-form">
                <label for="login-mail">MAIL</label>
                <input id="login-mail" name="email" type="email" autocomplete="email">

                <label for="login-password">PASSWORD</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password">

                <button class="login-submit" type="submit">
                    LOG IN
                </button>
            </form>

            <a class="create-account" href="index.html">
                SIGN UP
            </a>
        </section>
    </div>
    <script src="script.js"></script>
    <script src="api.js"></script>
    <script src="productlist.js"></script>
    <script src="login.js"></script>


</body>

</html>

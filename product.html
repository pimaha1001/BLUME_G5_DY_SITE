<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>BLUME – Produkt</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Fælles sidehoved og navigation. -->
    <header class="header">

        <a class="logo_wrap" href="index.html" aria-label="BLUME – forside">
            <img src="images/blume-logo.png" class="logo" alt="BLUME">

        </a>
        <button class="burger" aria-label="Åbn menu">
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
        </button>


        <nav class="navbar">
            <ul>
                <li><a href="index.html" class="active">Frontpage</a></li>
                <li><a href="productlist.html">Products</a></li>

            </ul>
        </nav>

        <nav class="header-actions" aria-label="Hurtige links">
            <a href="search.html" aria-label="Søg" title="Søg">
                <img src="images/search.svg" alt="" aria-hidden="true" width="30" height="30">
            </a>
            <a href="favorites.html" aria-label="Favoritter" title="Favoritter">
                <img src="images/heart.svg" alt="" aria-hidden="true" width="30" height="30">
            </a>
            <a href="profil.html" aria-label="Profil" title="Profil">
                <img src="images/profil.svg" alt="" aria-hidden="true" width="30" height="30">
            </a>
            <a href="basket.html" aria-label="Kurv" title="Kurv">
                <img src="images/basket.svg" alt="" aria-hidden="true" width="40" height="40">
            </a>
        </nav>

    </header>
    <!-- Produktfelterne udfyldes dynamisk ud fra id'et i URL'en. -->
    <main class="product-page">
        <a href="productlist.html" class="back-link" aria-label="Tilbage til produkter">
            ←
        </a>

        <p id="product-status" role="status" aria-live="polite">Henter produkt …</p>

        <!-- Indeholder produktbillede, information og købskontroller. -->
        <section class="product-detail" hidden>
            <div class="product-detail-image">
                <img class="detail-image" src="" alt="">
                <button class="product-favorite favorite-button" id="product-favorite" type="button"
                    aria-label="Tilføj til favoritter" aria-pressed="false">♡</button>
                <p class="detail-sale-tag"></p>
                <p class="detail-soldout-tag"></p>
            </div>

            <div class="product-content">
                <div class="product-specifications">
                    <div class="brand-information">
                        <h2 class="detail-brand"></h2>
                    </div>
                    <h2>Produktnavn</h2>
                    <p class="detail-model"></p>
                    <h2>Beskrivelse</h2>
                    <p class="detail-color"></p>
                    <h2>Produkt-id</h2>
                    <p class="detail-id"></p>

                </div>

                <aside class="product-buy-box">
                    <h2 class="detail-name"></h2>
                    <p class="product-category">
                        <span class="detail-brand-category"></span> |
                        <span class="detail-category"></span>
                    </p>
                    <div class="product-detail-price">
                        <p class="detail-sale-price"></p>
                        <p class="detail-original-price"></p>
                    </div>
                    <div class="purchase-actions">
                        <div class="quantity-selector" role="group" aria-label="Vælg antal">
                            <button type="button" class="quantity-minus" aria-label="Mindsk antal" disabled>−</button>
                            <span class="quantity-value" aria-live="polite">1</span>
                            <button type="button" class="quantity-plus" aria-label="Forøg antal">+</button>
                        </div>
                        <button class="add-to-basket" id="add-product-to-basket" type="button">Læg i kurv</button>
                    </div>
                    <p id="product-action-status" role="status" aria-live="polite"></p>
                </aside>
            </div>
        </section>
    </main>
    <footer class="footer">
        <div class="footer-grid">

            <div>
                <h3>Finding your way</h3>
                <ul>
                    <li><a href="index.html">Frontpage</a></li>
                    <li><a href="productlist.html">Productlist</a></li>

                </ul>
            </div>

            <div class="footer-social">
                <h4>BLUME</h4>

                <div class="social-icons">
                    <a href="#" target="_blank">
                        <img src="images/face_logo.png" alt="Facebook">
                    </a>

                    <a href="#" target="_blank">
                        <img src="images/insta_logo.png" alt="Instagram">
                    </a>
                </div>
            </div>

        </div>

        <div class="footer-bottom">
            <img src="images/blume-logo.png" class="logo" alt="BLUME">
            <p>© BLUME 2026. All Rights Reserved.</p>
        </div>
    </footer>
    <script src="script.js"></script>
    <script src="api.js"></script>
    <script src="product.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>BLUME – Kurv</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Fælles sidehoved med link tilbage til forsiden og kurven. -->
    <header class="header">
        <a class="logo_wrap" href="index.html" aria-label="BLUME – forside">
            <img src="images/blume-logo.png" class="logo" alt="BLUME">
        </a>
        <button class="burger" aria-label="Åbn menu">
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
        </button>
        <nav class="navbar">
            <ul>
                <li><a href="index.html">Frontpage</a></li>
                <li><a href="productlist.html">Products</a></li>
            </ul>
        </nav>
        <nav class="header-actions" aria-label="Hurtige links">
            <a href="search.html" aria-label="Søg" title="Søg">
                <img src="images/search.svg" alt="" aria-hidden="true" width="30" height="30">
            </a>
            <a href="favorites.html" aria-label="Favoritter" title="Favoritter">
                <img src="images/heart.svg" alt="" aria-hidden="true" width="30" height="30">
            </a>
            <a href="#" id="login-open" aria-label="Åbn login">
                <img src="images/profil.svg" alt="Profil" aria-hidden="true" width="30" height="30">
            </a>
            <a href="basket.html" aria-label="Kurv" title="Kurv">
                <img src="images/basket.svg" alt="" aria-hidden="true" width="40" height="40">
            </a>
        </nav>
    </header>

    <!-- Kurvside med varelinjer, antal og en enkel prisoversigt. -->
    <main class="basket-page">
        <div class="basket-heading">
            <h1>Din kurv</h1>
            <p id="basket-count" aria-live="polite"></p>
        </div>
        <p id="basket-status" role="status" aria-live="polite"></p>
        <div class="basket-layout">
            <section id="basket-items" class="basket-items" aria-label="Varer i kurven" aria-live="polite"></section>
            <aside class="basket-summary" aria-labelledby="basket-summary-title">
                <h2 id="basket-summary-title">Oversigt</h2>
                <div class="basket-summary-row">
                    <span>Subtotal</span>
                    <strong id="basket-subtotal"></strong>
                </div>
                <p>Levering beregnes ved betaling.</p>
                <button id="clear-basket" class="btn" type="button">Tøm kurven</button>
                <a class="basket-continue" href="productlist.html">Fortsæt med at handle</a>
            </aside>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-grid">
            <div>
                <h3>Finding your way</h3>

                <div class="footer-information">
                    <h3>Information</h3>
                    <ul>
                        <li><a href="index.html">about BLUME</a></li>
                        <li><a href="mailto:info@blume.dk">Contact</a></li>
                    </ul>
                </div>
                <ul>
                    <li><a href="index.html">Frontpage</a></li>
                    <li><a href="productlist.html">Productlist</a></li>
                </ul>
            </div>
            <div class="footer-social">
                <h4>BLUME</h4>
                <div class="social-icons">
                    <a href="#" target="_blank">
                        <img src="images/face_logo.png" alt="Facebook">
                    </a>
                    <a href="#" target="_blank">
                        <img src="images/insta_logo.png" alt="Instagram">
                    </a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <img src="images/blume-logo.png" class="logo" alt="BLUME">
            <p>© BLUME 2026. All Rights Reserved.</p>
        </div>
    </footer>
    <div class="login-overlay" id="login-overlay" hidden>
        <section class="login-popup" role="dialog" aria-modal="true" aria-labelledby="login-title">
            <button class="login-close" id="login-close" type="button" aria-label="Luk">
                &times;
            </button>

            <h2 id="login-title">LOG IN</h2>

            <form id="login-form">
                <label for="login-mail">MAIL</label>
                <input id="login-mail" name="email" type="email" autocomplete="email">

                <label for="login-password">PASSWORD</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password">

                <button class="login-submit" type="submit">
                    LOG IN
                </button>
            </form>

            <a class="create-account" href="index.html">
                SIGN UP
            </a>
        </section>
    </div>
    <script src="script.js"></script>
    <script src="api.js"></script>
    <script src="basket.js"></script>
    <script src="login.js"></script>

</body>

</html>
